# tmux: base config, shared by the Omarchy laptop and the Ubuntu workstation.
# Works anywhere on its own. The agent layer (pm-* keys, agent-sidebar, agent
# restore) lives in agents.conf and loads at the end when its tools are present.

# --- terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB,*256col*:RGB,foot*:RGB"
set -as terminal-features ",xterm-256color:sync"
# Panes run zsh on both machines (on Omarchy the login shell stays bash).
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh'
set -ga update-environment " COLORTERM"
# Copying goes straight to the system clipboard (OSC 52; foot and kitty support it).
set -s set-clipboard on
set -as terminal-features ",*:clipboard"
set -sg escape-time 10
# Shift+Enter and friends reach the apps (Claude Code's newline).
set -g extended-keys on
set -g extended-keys-format csi-u

# --- general
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
setw -g aggressive-resize on
set -g display-time 1500
set -g detach-on-destroy off
set -g set-titles on
# terminal title: session and what the focused pane is doing (the agent TUI
# sets its pane title to the conversation name)
set -g set-titles-string "#S · #{?#{==:#{pane_title},#{host_short}},#{b:pane_current_path},#{pane_title}}"
set -g status-keys emacs
setw -g mode-keys vi

# --- mouse
# Pane content never reaches the terminal's own scrollback, so wheel scrolling
# only works through copy mode. Shift bypasses tmux for native selection.
set -g mouse on

# Alternate-screen apps without mouse support (less, man, git log) get
# PageUp/PageDown; apps that asked for mouse events (nvim, htop, the agent
# sidebar) get the raw event; everything else scrolls via copy mode.
bind -n WheelUpPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "if -F '#{alternate_on}' 'send -t= PPage' 'copy-mode -e; send -M'"
bind -n WheelDownPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "if -F '#{alternate_on}' 'send -t= NPage' 'send -M'"

# Left-click: forward straight through to panes that asked for mouse events
# (the agent sidebar) instead of selecting them first, which is a wasted repaint.
bind -n MouseDown1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { select-pane -t= ; send -M }

# Right-click pastes the system clipboard (Wayland, both machines), same
# forwarding rule as the wheel.
bind -n MouseDown3Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { select-pane -t= ; run-shell 'wl-paste -n 2>/dev/null | tmux load-buffer -b sysclip - && tmux paste-buffer -b sysclip -d -p -t #{pane_id}' }
bind -T copy-mode-vi MouseDown3Pane send-keys -X cancel \; run-shell 'wl-paste -n 2>/dev/null | tmux load-buffer -b sysclip - && tmux paste-buffer -b sysclip -d -p -t #{pane_id}'

# Double-click a word, triple-click a line: straight to the clipboard.
bind -n DoubleClick1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { select-pane -t= ; copy-mode -H ; send -X select-word ; run -d 0.3 ; send -X copy-selection-and-cancel }
bind -n TripleClick1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { select-pane -t= ; copy-mode -H ; send -X select-line ; run -d 0.3 ; send -X copy-selection-and-cancel }
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run -d 0.3 \; send -X copy-selection-and-cancel
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run -d 0.3 \; send -X copy-selection-and-cancel

# --- panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- windows and sessions
bind c new-window -c "#{pane_current_path}"
bind Tab switch-client -l
bind s choose-tree -Zs -O name
bind y display-popup -E -B -w 64% -h 60% '~/dotfiles/tmux/sesh.sh'
bind n next-window
bind p previous-window
bind C-n next-window
bind C-p previous-window
bind R source-file ~/.tmux.conf \; display " reloaded"

# --- copy mode (yanks go to the system clipboard through OSC 52)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
# A drag released off its pane (status line, another pane, a border) still copies.
bind -n MouseDragEnd1StatusDefault if -F '#{pane_in_mode}' { send -X copy-selection-and-cancel }
bind -n MouseDragEnd1StatusLeft if -F '#{pane_in_mode}' { send -X copy-selection-and-cancel }
bind -n MouseDragEnd1StatusRight if -F '#{pane_in_mode}' { send -X copy-selection-and-cancel }
bind -n MouseDragEnd1Pane { run -C "if -F -t '#{window_id}' '##{pane_in_mode}' \"send -X -t '#{window_id}' copy-selection-and-cancel\"" ; send -M }
bind -n MouseDragEnd1Border run -C "if -F -t '#{window_id}' '##{pane_in_mode}' \"send -X -t '#{window_id}' copy-selection-and-cancel\""

# Floating popups (spawned on keypress only, no idle cost)
# Scratch popup toggle: prefix+d opens from anywhere; pressed again inside
# it (session is 'scratch') detaches -> closes the popup, keeps its state.
# Plain detach-whole-session moves to prefix+D.
bind d if -F "#{==:#{session_name},scratch}" detach-client 'display-popup -E -w 82% -h 82% -T "  scratch " "tmux new-session -A -s scratch"'
bind D detach-client

# --- theme: ANSI colour names, so it follows the terminal theme
# (Omarchy's current theme on the laptop, foot/theme-ubuntu.ini on Ubuntu).
# The bar forks nothing: every shell-out calls back into the single-threaded server
# and with many clients that backlog is what made the box crawl.
set -g status-interval 30
set -g status-style "bg=default,fg=default"
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-left-length 50
set -g status-right-length 80
# session pill: blue, yellow while the prefix is held, cyan in copy mode
set -g @pill "#{?pane_in_mode,cyan,#{?client_prefix,yellow,blue}}"
set -g status-left "#[fg=#{E:@pill},bg=default,nobold]#[fg=black,bg=#{E:@pill},bold]#{?client_prefix,󰠠,󰤂} #S #[fg=#{E:@pill},bg=default,nobold]#[fg=brightblack] #h "
set -g window-status-separator ""
set -g window-status-style "fg=brightblack"
set -g window-status-current-style "fg=blue,bold"
set -g window-status-format         "#{?#{e|>:#{session_windows},1}, #I #W ,}"
set -g window-status-current-format "#{?#{e|>:#{session_windows},1},#[fg=blue#,bold] #I #W ,}#{?window_zoomed_flag,#[fg=yellow]󰊓 ,}#{?pane_synchronized,#[fg=red]󰓦 ,}"
set -g window-status-bell-style "fg=yellow,bold"
set -g window-status-activity-style "fg=brightblack"
# path shows ~ at home; the running program appears when the pane is not a shell
set -g @label "#{?#{m:*sh,#{pane_current_command}},,   #{s/claude/cyan/:#{s/agent-sidebar/agents/:pane_current_command}}}"
set -g status-right "#[fg=brightblack]󰉋 #{?#{m|r:^/home/[^/]+$,#{pane_current_path}},~,#{b:pane_current_path}}#{E:@label}  %a %d %b #[fg=blue,nobold]#[fg=black,bg=blue,bold]󰥔 %H:%M #[fg=blue,bg=default,nobold] "
# Frames: no lines, only a caption row (the pane title, which the agent TUI sets
# to the conversation name; the sidebar gets none).
set -g pane-border-lines spaces
set -g pane-border-indicators off
set -g pane-border-style "fg=default,bg=default"
set -g pane-active-border-style "fg=default,bg=default"
set -g pane-border-status top
# caption only, no line: padded past any pane width so the rest of the row is background
set -g pane-border-format "#[bg=default]#{p600:#{?#{==:#{pane_current_command},agent-sidebar},,#{?pane_active,#[fg=blue#,bg=default#,nobold]#[fg=black#,bg=blue#,bold],#[fg=brightblack#,bg=default#,nobold]} #{?#{==:#{pane_title},#{host_short}},#{pane_current_command},#{s/^✳ //:pane_title}} #{?pane_active,#[fg=blue#,bg=default#,nobold],}}}"
set -g popup-border-style "fg=blue"
set -g popup-border-lines rounded
set -g message-style "bg=blue,fg=black"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
set -g copy-mode-match-style "bg=blue,fg=black"
set -g copy-mode-current-match-style "bg=yellow,fg=black"
set -g clock-mode-colour "blue"
set -g clock-mode-style 24
set -g display-panes-colour "brightblack"
set -g display-panes-active-colour "blue"
set -g menu-style "bg=default,fg=default"
set -g menu-selected-style "bg=blue,fg=black,bold"
set -g menu-border-style "fg=blue"
set -g menu-border-lines rounded

# --- plugins: tmux-resurrect only, loaded directly (no TPM). Installed by the
# installers into ~/.tmux/plugins/tmux-resurrect. prefix C-s saves, C-r restores.
# A save every 30 minutes (systemd timer) is ~50 snapshots a day; keep a week.
set -g @resurrect-delete-backup-after '7'
set -g @resurrect-strategy-nvim 'session'

if-shell '[ -x ~/.tmux/plugins/tmux-resurrect/resurrect.tmux ]' "run-shell '~/.tmux/plugins/tmux-resurrect/resurrect.tmux'"

# Saves are by hand (prefix C-s) or the timer; a fresh server on the default
# socket restores the last one.
if-shell -b '[ "#{b:socket_path}" = default ] && [ -x ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh ] && [ $(( $(date +%s) - #{start_time} )) -lt 10 ]' 'run-shell -b "sleep 1; ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh"'

# --- agent layer: pm-* keys, agent-sidebar, agent restore (when installed)
if-shell '[ -x ~/forge/agent-sidebar/agent-sidebar ] && [ -x ~/dotfiles/bin/pm-agent ]' 'source-file ~/dotfiles/tmux/agents.conf'
