# --- terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB,*256col*:RGB"

# MobaXterm sends wheel events only on the normal screen; on the alternate
# screen the wheel becomes arrow keys. Keep tmux off the alternate screen.
set -s terminal-overrides "xterm*:smcup@:rmcup@"

set -ga update-environment " COLORTERM"
set -s set-clipboard on
set -sg escape-time 10

# --- general
set -g default-command "${SHELL}"
set -g history-limit 20000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
setw -g aggressive-resize on
set -g display-time 1500
set -g detach-on-destroy off
set -g set-titles on
# terminal title: session and what the focused pane is doing (the agent TUI
# sets its pane title to the conversation name)
set -g set-titles-string "#S · #{?#{==:#{pane_title},#{host_short}},#{b:pane_current_path},#{pane_title}}"
set -g status-keys emacs
setw -g mode-keys vi

# --- mouse
# Pane content never reaches the terminal's own scrollback, so wheel scrolling
# only works through copy mode. Shift bypasses tmux for native selection.
set -g mouse on

# Alternate-screen apps without mouse support (less, man, git log) get
# PageUp/PageDown; apps that asked for mouse events (nvim, htop, the agent
# sidebar) get the raw event; everything else scrolls via copy mode.
bind -n WheelUpPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "if -F '#{alternate_on}' 'send -t= PPage' 'copy-mode -e; send -M'"
bind -n WheelDownPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "if -F '#{alternate_on}' 'send -t= NPage' 'send -M'"

# Left-click: forward straight through to panes that asked for mouse events
# (the agent sidebar) instead of selecting them first, which is a wasted repaint.
# In an agent's `diff` window, a left-click on the wstat pane (which doesn't grab
# the mouse itself) opens the clicked file's diff; every other pane behaves as before.
bind -n MouseDown1Pane if -F "#{&&:#{==:#{window_name},diff},#{&&:#{!:#{mouse_any_flag}},#{!:#{pane_in_mode}}}}" { run-shell "~/dotfiles/bin/wclick '#{pane_id}' #{mouse_y} '#{pane_current_path}'" } { if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { select-pane -t= ; send -M } }

# Right-click pastes the Windows clipboard via MobaXterm's X server, same
# forwarding rule as the wheel.
bind -n MouseDown3Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { select-pane -t= ; run-shell '/home/infra/dotfiles/tmux/tmux-clip.sh paste #{pane_id}' }
bind -T copy-mode-vi MouseDown3Pane send-keys -X cancel \; run-shell '~/dotfiles/tmux/tmux-clip.sh paste #{pane_id}'

# Double-click a word, triple-click a line: straight to the clipboard.
bind -n DoubleClick1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { select-pane -t= ; copy-mode -H ; send -X select-word ; run -d 0.3 ; send -X copy-pipe-and-cancel "~/dotfiles/tmux/tmux-clip.sh copy #{pane_id}" }
bind -n TripleClick1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { select-pane -t= ; copy-mode -H ; send -X select-line ; run -d 0.3 ; send -X copy-pipe-and-cancel "~/dotfiles/tmux/tmux-clip.sh copy #{pane_id}" }
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run -d 0.3 \; send -X copy-pipe-and-cancel "~/dotfiles/tmux/tmux-clip.sh copy #{pane_id}"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run -d 0.3 \; send -X copy-pipe-and-cancel "~/dotfiles/tmux/tmux-clip.sh copy #{pane_id}"

# --- panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- windows
bind c new-window -c "#{pane_current_path}"
bind Tab switch-client -l
bind s choose-tree -Zs -O name
bind y display-popup -E -B -w 64% -h 60% '~/dotfiles/tmux/sesh.sh'
bind n next-window
bind p previous-window
bind C-n next-window
bind C-p previous-window
bind b last-window

# --- copy mode
# MobaXterm ignores OSC 52, so yanks go through the X11 clipboard bridge.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/dotfiles/tmux/tmux-clip.sh copy #{pane_id}"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/dotfiles/tmux/tmux-clip.sh copy #{pane_id}"

bind r source-file ~/.tmux.conf \; display " reloaded"

# prefix+a: fuzzy-pick where to open an agent (privatemind pinned → AgentN slot;
# any other dir → agent in that repo), then launch it with a live diff window.
bind a display-popup -E -B -w 74% -h 64% '~/dotfiles/bin/pm-agent-pick'
# prefix+q: end (quit) this agent — kill the session and reset its slot to main
# (clean). No prompt; run-shell reliably passes the session name. (Replaces the
# default display-panes, which is redundant with h/j/k/l pane nav.)
bind q run-shell -b "~/dotfiles/bin/pm-agent-end '#{session_name}'"

# Floating popups (spawned on keypress only, no idle cost)
# Scratch popup toggle: prefix+d opens from anywhere; pressed again inside
# it (session is 'scratch') detaches -> closes the popup, keeps its state.
# Plain detach-whole-session moves to prefix+D.
bind d if -F "#{==:#{session_name},scratch}" detach-client 'display-popup -E -w 82% -h 82% -T "  scratch " "tmux new-session -A -s scratch"'
bind D detach-client
# prefix+g: look inside changed files (fzf list + delta diff) for the workspace
# or slot under the current pane's path. Replaces lazygit. See ~/dotfiles/bin/wdiff.
bind g display-popup -E -w 92% -h 92% -d "#{pane_current_path}" -T " 󰈢 diff " "~/dotfiles/bin/wdiff"

# --- theme (Tokyo Night, native)
# The bar forks nothing: every shell-out calls back into the single-threaded server
# and with many clients that backlog is what made the box crawl.
set -g status-interval 30
set -g status-style "bg=default,fg=#a9b1d6"
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-left-length 50
set -g status-right-length 80
# session pill: blue, amber while the prefix is held, teal in copy mode
set -g @pill "#{?pane_in_mode,#7dcfff,#{?client_prefix,#e0af68,#7aa2f7}}"
set -g status-left "#[fg=#{E:@pill},bg=default,nobold]#[fg=#1a1b26,bg=#{E:@pill},bold]#{?client_prefix,󰠠,󰤂} #S #[fg=#{E:@pill},bg=default,nobold]#[fg=#565f89] #h "
set -g window-status-separator ""
set -g window-status-style "fg=#565f89"
set -g window-status-current-style "fg=#7aa2f7,bold"
set -g window-status-format         "#{?#{e|>:#{session_windows},1}, #I #W ,}"
set -g window-status-current-format "#{?#{e|>:#{session_windows},1},#[fg=#2a2f41]#[fg=#7aa2f7#,bg=#2a2f41#,bold]#I #W #[fg=#2a2f41#,bg=default],}#{?window_zoomed_flag,#[fg=#e0af68]󰊓 ,}#{?pane_synchronized,#[fg=#f7768e]󰓦 ,}"
set -g window-status-bell-style "fg=#e0af68,bold"
set -g window-status-activity-style "fg=#565f89"
# path shows ~ at home; the running program appears when the pane is not a shell
set -g @label "#{?#{m:*sh,#{pane_current_command}},,   #{s/agent-sidebar/agents/:pane_current_command}}"
set -g status-right "#[fg=#565f89]󰉋 #{?#{m|r:^/home/[^/]+$,#{pane_current_path}},~,#{b:pane_current_path}}#{E:@label}  %a %d %b #[fg=#7aa2f7,nobold]#[fg=#1a1b26,bg=#7aa2f7,bold]󰥔 %H:%M #[fg=#7aa2f7,bg=default,nobold] "
# Frames: no lines. Borders are painted in the background colour and concealed;
# the caption row is the only thing left of them.
# The caption is the pane title, which the agent TUI sets to the conversation name; the sidebar gets none.
set -g pane-border-lines heavy
# 3.6+ can draw borders as spaces: nothing to see whatever the terminal background
if -F '#{m:3.[6-9]*,#{version}}' 'set -g pane-border-lines spaces'
set -g pane-border-indicators off
set -g pane-border-style "fg=#1a1b26,bg=default,hidden"
set -g pane-active-border-style "fg=#1a1b26,bg=default,hidden"
set -g pane-border-status top
# caption only, no line: padded past any pane width so the rest of the row is background
set -g pane-border-format "#[bg=default]#{p600:#{?#{==:#{pane_current_command},agent-sidebar},,#{?pane_active,#[fg=#7aa2f7#,bg=default#,nobold]#[fg=#1a1b26#,bg=#7aa2f7#,bold],#[fg=#2a2f41#,bg=default#,nobold]#[fg=#565f89#,bg=#2a2f41]} #{?#{==:#{pane_title},#{host_short}},#{pane_current_command},#{s/^✳ //:pane_title}} #{?pane_active,#[fg=#7aa2f7#,bg=default#,nobold],#[fg=#2a2f41#,bg=default#,nobold]}}}"
set -g popup-border-style "fg=#7aa2f7"
set -g popup-border-lines rounded
set -g message-style "bg=#7aa2f7,fg=#1a1b26"
set -g message-command-style "bg=#2a2f41,fg=#7aa2f7"
set -g mode-style "bg=#2a2f41,fg=#7dcfff"
set -g copy-mode-match-style "bg=#3d59a1,fg=#c0caf5"
set -g copy-mode-current-match-style "bg=#ff9e64,fg=#1a1b26"
set -g clock-mode-colour "#7aa2f7"
set -g clock-mode-style 24
set -g display-panes-colour "#565f89"
set -g display-panes-active-colour "#7aa2f7"
set -g menu-style "bg=default,fg=#a9b1d6"
set -g menu-selected-style "bg=#7aa2f7,fg=#1a1b26,bold"
set -g menu-border-style "fg=#7aa2f7"
set -g menu-border-lines rounded

# --- plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @resurrect-strategy-nvim 'session'
# agent panes come back with their conversation (claude-pane-hook.sh tags them)
set -g @resurrect-hook-post-save-all '~/dotfiles/tmux/claude-panes.sh save'
set -g @resurrect-hook-post-restore-all '~/dotfiles/tmux/claude-panes.sh restore'

run '~/.tmux/plugins/tpm/tpm'

# Saves run from the tmux-resurrect-save systemd timer. Restore the last save
# only when a fresh server on the default socket sources this file.
if-shell -b '[ "#{b:socket_path}" = default ] && [ -x ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh ] && [ $(( $(date +%s) - #{start_time} )) -lt 10 ]' 'run-shell -b "sleep 1; ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh"'

set -g @agent_sidebar_key 'e'
set -g @agent_sidebar_width '28'
set -g @agent_sidebar_exclude 'scratch'
set -g @agent_sidebar_sessions 'on'
set -g @agent_sidebar_legend 'e sidebar;o agents;y sesh;s tree;d scratch;a new agent;q end agent;g diff;| split;- split;x close'
set -g @agent_sidebar_picker_key 'o'
run-shell -b '~/forge/agent-sidebar/sidebar.tmux'
