# tmux agent layer: the pm-* workflow keys, agent-sidebar, and bringing agent
# conversations back after a restore. Loaded by .tmux.conf when
# ~/forge/agent-sidebar and ~/dotfiles/bin/pm-agent are present.

# prefix+a: fuzzy-pick where to open an agent (privatemind pinned -> AgentN slot;
# any other dir -> agent in that repo).
bind a display-popup -E -B -w 74% -h 64% '~/dotfiles/bin/pm-agent-pick'
# prefix+q: end this agent, no prompt: kill the session and reset its slot to main.
bind q run-shell -b "~/dotfiles/bin/pm-agent-end '#{session_id}'"
# prefix+o: reopen a closed conversation in its own session, the inverse of prefix+q
bind o run-shell -b "tmux display-popup -c '#{client_name}' -E -B -w 84% -h 70% \"~/dotfiles/bin/pm-agent-reopen '#{pane_id}'\""
# prefix+r: reset this agent - kill it and relaunch a fresh one, SAME name/slot,
# with a fresh pull off main and a FRESH conversation. To keep the conversation
# and wipe nothing, that is `pm-agent --restart`, which has no key on purpose.
# (Config reload is prefix+R.)
bind r display-popup -E -w 60% -h 30% -T '  reset agent ' "~/dotfiles/bin/pm-agent --reset"
# prefix+B: branch this conversation into its OWN tmux session, live beside the
# one it came from and listed in the sidebar. This pane is left alone. Enter
# names it "branch of <this session>".
bind B command-prompt -p '  branch name (Enter = "branch of this one"):' { run-shell -b "~/dotfiles/bin/pm-agent-branch '#{pane_id}' \"%%%\"" }
# prefix+b: the shared board, and back
bind b if -F '#{==:#{window_name},board}' last-window { run-shell -b "~/dotfiles/bin/pm-board open '#{session_id}'" }

# agent panes come back with their conversation (claude-pane-hook.sh tags them)
set -g @resurrect-hook-post-save-all '~/dotfiles/tmux/claude-panes.sh save'
set -g @resurrect-hook-post-restore-all '~/dotfiles/tmux/claude-panes.sh restore'

# --- agent-sidebar
set -g @agent_sidebar_key 'e'
set -g @agent_sidebar_exclude 'scratch'
set -g @agent_sidebar_sessions 'on'
# minutes idle before an agent reads as wanting you (amber); 0 disables
set -g @agent_sidebar_idle_wait '30'
set -g @agent_sidebar_legend 'herd:;a new agent;u agents;e sidebar;b board;o reopen;B branch;r reset;q end agent;tmux:;y sesh;s tree;d scratch;| split right;- split down'
set -g @agent_sidebar_picker_key 'u'
run-shell -b '~/forge/agent-sidebar/sidebar.tmux'
