# Shared foot config (Omarchy laptop + Ubuntu workstation).
# Colors: ~/.config/foot/theme.ini, linked per machine by scripts/install.sh
#   Omarchy -> the current Omarchy theme (follows theme switches)
#   Ubuntu  -> foot/theme-ubuntu.ini (Ristretto, static)
[main]
selection-target=both
include=~/.config/foot/theme.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=beam
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

[mouse-bindings]
# Right-click pastes the clipboard (selection already copies to it).
select-extend=none
clipboard-paste=BTN_RIGHT
