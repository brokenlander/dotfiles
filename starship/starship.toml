# Shared starship prompt (Omarchy + Ubuntu).
# Colors are ANSI names so the prompt follows the active terminal theme.
add_newline = false
command_timeout = 200
format = """\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$kubernetes\
$jobs\
$cmd_duration\
$character"""

[character]
success_symbol = "[❯](blue)"
error_symbol = "[❯](red)"

[hostname]
ssh_only = false
style = "bright-black"
format = "[$hostname]($style):"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "purple"

[git_status]
style = "yellow"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"

[python]
symbol = " "
style = "green"
format = "[($symbol$virtualenv )]($style)"

[nodejs]
symbol = " "
style = "green"
format = "[$symbol]($style)"

[kubernetes]
disabled = false
detect_env_vars = ["KUBECONFIG"]
style = "cyan"
format = "[$symbol$context(/$namespace)]($style) "

[jobs]
style = "cyan"
symbol = "&"
format = "[$symbol$number]($style) "

[line_break]
disabled = true

[cmd_duration]
min_time = 2_000
style = "bright-black"
format = "[$duration ]($style)"
