# Screen off after 5 minutes idle. No screensaver, no automatic lock
# (Omarchy's own idle is disabled in shell.json: screensaver 0, lock 0).
general {
    ignore_dbus_inhibit = false   # video playback keeps the screen on
}

listener {
    timeout = 300
    on-timeout = omarchy-brightness-display off
    on-resume = omarchy-system-wake
}
