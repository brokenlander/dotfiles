# Battery care (Dell): charge stops at 80%, restarts below 50%. Dell keeps this
# in firmware; this re-applies it at boot in case firmware or an update resets it.
w /sys/class/power_supply/BAT0/charge_control_start_threshold - - - - 50
w /sys/class/power_supply/BAT0/charge_control_end_threshold - - - - 80
